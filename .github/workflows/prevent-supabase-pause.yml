name: Prevent Supabase Pause

on:
  schedule:
    # Runs every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PROJECT_ID: ugvehqkqsvolpdqwaggg
        run: |
          # The SUPABASE_KEY repo secret (the anon key) is what remains optional:
          # skip instead of failing the run every hour until it is set.
          if [ -z "$SUPABASE_KEY" ]; then
            echo "SUPABASE_KEY secret not set. Skipping."
            exit 0
          fi

          URL="https://$PROJECT_ID.supabase.co/rest/v1/settings?select=key&limit=1"
          RESPONSE_FILE=$(mktemp)
          ATTEMPTS=3

          echo "Pinging Supabase Project: $PROJECT_ID..."

          # Supabase's gateway returns an occasional 504, and a single blip used to
          # fail the whole run and mail out an alert. Retry before concluding the
          # project is actually unreachable. Note a 5xx still reached Supabase, so it
          # counts as activity for pause prevention either way -- these retries are
          # about not crying wolf, not about keeping the project awake.
          for i in $(seq 1 "$ATTEMPTS"); do
            HTTP_STATUS=$(curl -s -w "%{http_code}" \
              -o "$RESPONSE_FILE" \
              --max-time 30 \
              -X GET "$URL" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" || echo "000")

            # curl can die mid-write and leave a partial body where the code should be.
            case "$HTTP_STATUS" in ''|*[!0-9]*) HTTP_STATUS=000 ;; esac

            # Anything the origin answers -- 4xx included -- is a live database.
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 500 ]; then
              echo "Success! Activity logged. Status: $HTTP_STATUS (attempt $i/$ATTEMPTS)"
              exit 0
            fi

            echo "Attempt $i/$ATTEMPTS failed. Status: $HTTP_STATUS"
            echo "Details: $(cat "$RESPONSE_FILE")"

            if [ "$i" -lt "$ATTEMPTS" ]; then
              sleep $((i * 15))
            fi
          done

          # Deliberately not a failure. Supabase pauses a free project after about
          # seven days of inactivity -- roughly 168 consecutive missed pings -- so one
          # bad run has no consequence and the next hourly run covers it. Failing here
          # only produced alert mail for a blip nobody needed to act on.
          #
          # It is still recorded: ::warning:: annotates the run in the Actions UI and
          # the summary below shows on the run page, neither of which sends mail. If
          # the portal itself ever stops working, that is the signal worth acting on.
          echo "::warning::Supabase did not answer across $ATTEMPTS attempts (last status $HTTP_STATUS). Not failing the run -- a single missed ping cannot pause the project."
          {
            echo "### Keep-alive ping did not land"
            echo ""
            echo "- Attempts: \`$ATTEMPTS\`"
            echo "- Last status: \`$HTTP_STATUS\` (000 = request never completed, 5xx = gateway refused)"
            echo "- Not treated as a failure: pausing needs ~7 days of inactivity, so the next hourly run covers this."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
